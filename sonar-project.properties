# SonarQube Cloud analysis settings. The `sonar` job in .github/workflows/ci.yml reads this file.
# Setup steps: https://tdevine1.github.io/xPostForecast/students/sonarqube.html

# From your SonarQube Cloud project: Information page (the project key is usually <organization>_<repository>).
sonar.organization=YOUR_SONARQUBE_CLOUD_ORGANIZATION_KEY
sonar.projectKey=YOUR_ORGANIZATION_KEY_your-repository-name

# What to analyze. Paths are relative to the repository root (where this file lives).
sonar.sources=frontend/src,backend
sonar.tests=frontend/src,backend/tests
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,backend/tests/**
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.test.js,**/*.test.jsx,backend/tests/**

# Test coverage reports written by `npm run test:coverage` (the CI job prefixes their file paths with
# frontend/ and backend/ so SonarQube can match them to the sources above).
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
