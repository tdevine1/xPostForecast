# Builds frontend/ and deploys it to Azure Static Web Apps whenever frontend code changes on main.
#
# The app is built HERE (not by Azure) so tests run first and the Node version is ours to choose.
#
# Repository secrets this workflow needs (Settings > Secrets and variables > Actions):
#   AZURE_STATIC_WEB_APPS_API_TOKEN  SWA deployment token (Azure Portal > your Static Web App > Manage deployment token)
#   VITE_BACKEND_API_URL             backend URL, e.g. https://<app>.azurewebsites.net (no trailing slash)
name: Deploy frontend (Static Web Apps)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: # also allows a manual "Run workflow" button in the Actions tab

# Never run two deployments at once
concurrency: deploy-frontend

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check repository settings
        env:
          VITE_BACKEND_API_URL: ${{ secrets.VITE_BACKEND_API_URL }}
          HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
        run: |
          [ -n "$VITE_BACKEND_API_URL" ] || { echo "::error::Repository secret VITE_BACKEND_API_URL is not set"; exit 1; }
          case "$VITE_BACKEND_API_URL" in */) echo "::error::VITE_BACKEND_API_URL must not end with /"; exit 1;; esac
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::Repository secret AZURE_STATIC_WEB_APPS_API_TOKEN is not set"; exit 1; }

      - run: npm ci
      - run: npm test # a failing test stops the deployment

      - name: Build
        run: npm run build
        env:
          # Vite copies this value into the JavaScript bundle at build time
          VITE_BACKEND_API_URL: ${{ secrets.VITE_BACKEND_API_URL }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist # the already-built site (includes staticwebapp.config.json)
          skip_app_build: true
